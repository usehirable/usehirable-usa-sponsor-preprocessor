name: Publish USA sponsors

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-usa-sponsors
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build sponsor JSON
        run: python src/build_usa_sponsors.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/usa-sponsors.json dist/manifest.json dist/usa-*.json

          if git diff --cached --quiet; then
            echo "No generated sponsor changes to commit."
            exit 0
          fi

          git commit -m "Update generated USA sponsor data"
          git push
