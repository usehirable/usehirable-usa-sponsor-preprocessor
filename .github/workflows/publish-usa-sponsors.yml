name: Publish USA sponsors

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update USA sponsors"
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: usa-sponsor-publish
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build sponsor JSON
        if: github.event_name == 'workflow_dispatch'
        run: python src/build_usa_sponsors.py

      - name: Download sponsor JSON from triggering update
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: usa-sponsors-json
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/usa-sponsors.json dist/manifest.json dist/usa-*.json

          if git diff --cached --quiet; then
            echo "No generated sponsor changes to commit."
            exit 0
          fi

          git commit -m "Update generated USA sponsor data"
          git push
